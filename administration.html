<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script>
    const savedTheme =
      localStorage.getItem("nickel_master_theme") || "light";

    document.documentElement.setAttribute(
      "data-theme",
      savedTheme
    );
  </script>

  <title>Administration - Nickel Master</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body class="dashboard-body">

<div class="dashboard-layout">


  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside class="sidebar">

    <div class="logo">

      <img
        src="images/logo-nickel.png"
        alt="Nickel"
        class="sidebar-logo-img"
      >

      <span>
        NICKEL<br>MASTER
      </span>

    </div>


    <nav class="side-menu">

      <button
        onclick="window.location.href='home.html'"
      >
        🏠 Accueil
      </button>

      <button
        onclick="window.location.href='training.html'"
      >
        🎯 Entraînement
      </button>

      <button>
        🏆 Challenges
      </button>

      <button
        onclick="window.location.href='ranking.html'"
      >
        📊 Classements
      </button>

      <button>
        ⚔️ Battle
      </button>

      <button>
        🎮 Kahoot
      </button>

      <button
        onclick="window.location.href='profile.html'"
      >
        📈 Performances
      </button>

      <button
        onclick="window.location.href='badges.html'"
      >
        🏅 Badges
      </button>

      <button
        class="active"
        onclick="window.location.href='administration.html'"
      >
        🛡️ Administration
      </button>

    </nav>


    <div class="sidebar-bottom">

      <button
        onclick="window.location.href='settings.html'"
      >
        ⚙️ Paramètres
      </button>

      <button
        id="themeToggle"
        class="sidebar-link theme-button"
        onclick="toggleTheme()"
      >
        🌙 Mode sombre
      </button>

      <button
        class="sidebar-link"
        onclick="logout()"
      >
        🚪 Déconnexion
      </button>

    </div>

  </aside>



  <!-- =====================================================
       CONTENU PRINCIPAL
  ====================================================== -->

  <main class="dashboard-main">


    <!-- ===================================================
         TOPBAR
    ==================================================== -->

    <header class="topbar">

      <input
        type="text"
        placeholder="Rechercher..."
        disabled
      >

      <div class="topbar-right">

        <strong id="topUserName">
          Administrateur
        </strong>

      </div>

    </header>



    <!-- ===================================================
         ADMINISTRATION
    ==================================================== -->

    <section class="settings-page">

      <div class="settings-header">

        <h1>
          🛡️ Administration
        </h1>

        <p>
          Gère les outils d'administration de Nickel Master.
        </p>

      </div>



      <div class="settings-grid">


        <!-- =================================================
             GESTION DES QUIZ
        ================================================== -->

        <button
          class="settings-card"
          onclick="window.location.href='admin-quizzes.html'"
        >

          <div class="settings-card-icon">
            🎯
          </div>

          <div class="settings-card-content">

            <h2>
              Gestion des Quiz
            </h2>

            <p>
              Ajoute, modifie et organise les questions et les catégories.
            </p>

          </div>

          <div class="settings-card-arrow">
            ›
          </div>

        </button>



        <!-- =================================================
             APPROBATIONS
        ================================================== -->

        <button
          class="settings-card"
          onclick="window.location.href='approvals.html'"
        >

          <div class="settings-card-icon">
            ✅
          </div>

          <div class="settings-card-content">

            <h2>
              Approbations
            </h2>

            <p>
              Consulte et traite les demandes nécessitant une validation.
            </p>

          </div>

          <div class="settings-card-arrow">
            ›
          </div>

        </button>



        <!-- =================================================
             GESTION DES SIGNALEMENTS
        ================================================== -->

        <button
          class="settings-card settings-card-disabled"
          disabled
        >

          <div class="settings-card-icon">
            🚩
          </div>

          <div class="settings-card-content">

            <h2>
              Gestion des signalements
            </h2>

            <p>
              Consulte les questions signalées et traite les remontées des collaborateurs.
            </p>

            <small>
              Bientôt disponible
            </small>

          </div>

        </button>



        <!-- =================================================
             GESTION DES UTILISATEURS
        ================================================== -->

        <button
          class="settings-card"
          onclick="window.location.href='admin-users.html'"
        >

          <div class="settings-card-icon">
            👥
          </div>

          <div class="settings-card-content">

            <h2>
              Gestion des utilisateurs
            </h2>

            <p>
              Gère les comptes, les rôles et les accès à Nickel Master.
            </p>

          </div>

          <div class="settings-card-arrow">
            ›
          </div>

        </button>



        <!-- =================================================
             GESTION DE L'ORGANISATION
        ================================================== -->

        <button
          class="settings-card"
          onclick="window.location.href='admin-organization.html'"
        >

          <div class="settings-card-icon">
            🏢
          </div>

          <div class="settings-card-content">

            <h2>
              Gestion de l'organisation
            </h2>

            <p>
              Gère les services, équipes, fonctions, rôles et accès.
            </p>

          </div>

          <div class="settings-card-arrow">
            ›
          </div>

        </button>
<!-- =================================================
     GESTION DES FORMATIONS
================================================== -->

<button
  class="settings-card"
  onclick="window.location.href='admin-trainings.html'"
>

  <div class="settings-card-icon">
    🎓
  </div>

  <div class="settings-card-content">

    <h2>
      Gestion des formations
    </h2>

    <p>
      Crée les formations et associe-les aux catégories de quiz accessibles.
    </p>

  </div>

  <div class="settings-card-arrow">
    ›
  </div>

</button>


        <!-- =================================================
             GESTION DE LA BOÎTE À IDÉES
        ================================================== -->

        <button
          class="settings-card settings-card-disabled"
          disabled
        >

          <div class="settings-card-icon">
            💡
          </div>

          <div class="settings-card-content">

            <h2>
              Gestion de la boîte à idées
            </h2>

            <p>
              Consulte, classe et traite les idées proposées par les collaborateurs.
            </p>

            <small>
              Bientôt disponible
            </small>

          </div>

        </button>


      </div>

    </section>

  </main>

</div>



<!-- =====================================================
     SCRIPTS
====================================================== -->

<script src="app.js"></script>
<script src="theme.js"></script>


<script>

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      /* ===============================================
         SÉCURITÉ ADMIN
      ================================================ */

      const role =
        String(
          localStorage.getItem("role") || ""
        )
        .trim()
        .toLowerCase();


      if (role !== "admin") {

        alert(
          "Cette page est réservée à l'administrateur."
        );

        window.location.href =
          "home.html";

        return;
      }



      /* ===============================================
         NOM UTILISATEUR
      ================================================ */

      const name =
        localStorage.getItem("full_name") ||
        "Administrateur";


      const user =
        document.getElementById(
          "topUserName"
        );


      if (user) {

        user.innerText =
          name;
      }

    }
  );

</script>

</body>

</html>
