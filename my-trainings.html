<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script>
    const savedTheme =
      localStorage.getItem("nickel_master_theme") || "light";

    document.documentElement.setAttribute(
      "data-theme",
      savedTheme
    );
  </script>

  <title>Mes formations - Nickel Master</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body class="dashboard-body">

<div class="dashboard-layout">

  <!-- =========================
       SIDEBAR
  ========================= -->

  <aside class="sidebar">

    <div class="logo">

      <img
        src="images/logo-nickel.png"
        alt="Nickel"
        class="sidebar-logo-img"
      >

      <span>
        NICKEL<br>MASTER
      </span>

    </div>


    <nav class="side-menu">

      <button
        onclick="window.location.href='home.html'"
      >
        🏠 Accueil
      </button>

      <button
        onclick="window.location.href='training.html'"
      >
        🎯 Entraînement
      </button>

      <button>
        🏆 Challenges
      </button>

      <button
        onclick="window.location.href='ranking.html'"
      >
        📊 Classements
      </button>

      <button>
        ⚔️ Battle
      </button>

      <button>
        🎮 Kahoot
      </button>

      <button
        onclick="window.location.href='profile.html'"
      >
        📈 Mes stats
      </button>

      <button
        onclick="window.location.href='badges.html'"
      >
        🏅 Badges
      </button>

      <button>
        💡 Boîte à idées
      </button>

      <button>
        🚩 Signalements
      </button>

    </nav>


    <div class="sidebar-bottom">

      <button
        class="active"
        onclick="window.location.href='settings.html'"
      >
        ⚙️ Paramètres
      </button>

      <button
        id="themeToggle"
        class="sidebar-link theme-button"
        onclick="toggleTheme()"
      >
        🌙 Mode sombre
      </button>

      <button
        class="sidebar-link"
        onclick="logout()"
      >
        🚪 Déconnexion
      </button>

    </div>

  </aside>


  <!-- =========================
       CONTENU
  ========================= -->

  <main class="dashboard-main">

    <header class="topbar">

      <div class="topbar-welcome">

        <h1>
          🎓 Mes formations
        </h1>

        <p>
          Retrouve les formations auxquelles tu es formé.
        </p>

      </div>

      <div class="topbar-right">

        <strong id="topUserName">
          Utilisateur
        </strong>

      </div>

    </header>


    <section class="trainings-page">

      <div
        id="myTrainingsList"
        class="trainings-grid"
      >
        Chargement...
      </div>

    </section>

  </main>

</div>


<script src="app.js"></script>
<script src="theme.js"></script>


<script>
  document.addEventListener(
    "DOMContentLoaded",
    async function () {

      const name =
        localStorage.getItem("full_name") ||
        "Utilisateur";

      const topName =
        document.getElementById(
          "topUserName"
        );

      if (topName) {
        topName.innerText = name;
      }

      await loadMyTrainings();
    }
  );
</script>

</body>

</html>
