<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script>
    const savedTheme =
      localStorage.getItem("nickel_master_theme") || "light";

    document.documentElement.setAttribute(
      "data-theme",
      savedTheme
    );
  </script>

  <title>Gestion des questions - Nickel Master</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body class="dashboard-body">

<div class="dashboard-layout">


  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside class="sidebar">

    <div class="logo">

      <img
        src="images/logo-nickel.png"
        alt="Nickel"
        class="sidebar-logo-img"
      >

      <span>
        NICKEL<br>MASTER
      </span>

    </div>


    <!-- ===================================================
         MENU PRINCIPAL
    ==================================================== -->

    <nav class="side-menu">

      <button
        onclick="window.location.href='home.html'"
      >
        🏠 Accueil
      </button>


      <button
        onclick="window.location.href='training.html'"
      >
        🎯 Entraînement
      </button>


      <button>
        🏆 Challenges
      </button>


      <button
        onclick="window.location.href='ranking.html'"
      >
        📊 Classements
      </button>


      <button>
        ⚔️ Battle
      </button>


      <button>
        🎮 Kahoot
      </button>


      <button
        onclick="window.location.href='profile.html'"
      >
        📈 Mes stats
      </button>


      <button
        onclick="window.location.href='badges.html'"
      >
        🏅 Badges
      </button>


      <button>
        💡 Boîte à idées
      </button>


      <button>
        🚩 Signalements
      </button>

    </nav>



    <!-- ===================================================
         BAS SIDEBAR
    ==================================================== -->

    <div class="sidebar-bottom">


      <!-- ===============================================
           PANEL ADMINISTRATION
      ================================================ -->

      <div class="admin-panel">

        <div class="admin-panel-title">
          🛡️ Administration
        </div>


        <button
          type="button"
          class="admin-panel-link"
          onclick="window.location.href='admin-questions.html'"
        >
          ➕ Ajouter des questions
        </button>


        <button
          type="button"
          class="admin-panel-link active"
          onclick="window.location.href='admin-question-management.html'"
        >
          🧰 Gérer les questions
        </button>


        <button
          type="button"
          class="admin-panel-link"
          onclick="window.location.href='approvals.html'"
        >
          ✅ Approbations
        </button>

      </div>



      <!-- PARAMÈTRES -->

      <button
        onclick="window.location.href='settings.html'"
      >
        ⚙️ Paramètres
      </button>


      <!-- THÈME -->

      <button
        id="themeToggle"
        class="sidebar-link theme-button"
        onclick="toggleTheme()"
      >
        🌙 Mode sombre
      </button>


      <!-- DÉCONNEXION -->

      <button
        class="sidebar-link"
        onclick="logout()"
      >
        🚪 Déconnexion
      </button>

    </div>

  </aside>



  <!-- =====================================================
       CONTENU PRINCIPAL
  ====================================================== -->

  <main class="dashboard-main">


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="question-management-header">

      <div>

        <h1>
          Gestion des questions
        </h1>

        <p>
          Recherche, modifie, désactive ou supprime les questions.
        </p>

      </div>


      <strong id="questionManagementUser">
        Administrateur
      </strong>

    </header>



    <!-- ===================================================
         FILTRES
    ==================================================== -->

    <section class="question-management-filters">


      <!-- RECHERCHE -->

      <div class="question-filter-field">

        <label for="questionManagementSearch">
          Rechercher
        </label>

        <input
          id="questionManagementSearch"
          type="text"
          placeholder="Question, catégorie..."
        >

      </div>



      <!-- CATÉGORIE -->

      <div class="question-filter-field">

        <label for="questionManagementCategory">
          Catégorie
        </label>

        <select id="questionManagementCategory">

          <option value="">
            Toutes les catégories
          </option>

        </select>

      </div>



      <!-- TYPE -->

      <div class="question-filter-field">

        <label for="questionManagementType">
          Type
        </label>

        <select id="questionManagementType">

          <option value="">
            Tous les types
          </option>

          <option value="true_false">
            Vrai / Faux
          </option>

          <option value="simple_choice">
            Choix simple
          </option>

          <option value="multiple_choice">
            Choix multiple
          </option>

        </select>

      </div>



      <!-- STATUT -->

      <div class="question-filter-field">

        <label for="questionManagementStatus">
          Statut
        </label>

        <select id="questionManagementStatus">

          <option value="">
            Tous
          </option>

          <option value="active">
            Actives
          </option>

          <option value="inactive">
            Désactivées
          </option>

        </select>

      </div>

    </section>



    <!-- ===================================================
         STATISTIQUES
    ==================================================== -->

    <section class="question-management-stats">


      <!-- TOTAL -->

      <div>

        <small>
          Total
        </small>

        <strong id="questionManagementTotal">
          0
        </strong>

      </div>



      <!-- ACTIVES -->

      <div>

        <small>
          Actives
        </small>

        <strong id="questionManagementActive">
          0
        </strong>

      </div>



      <!-- DÉSACTIVÉES -->

      <div>

        <small>
          Désactivées
        </small>

        <strong id="questionManagementInactive">
          0
        </strong>

      </div>

    </section>



    <!-- ===================================================
         LISTE DES QUESTIONS
    ==================================================== -->

    <section
      id="questionManagementList"
      class="question-management-list"
    >

      <div class="question-management-empty">
        Chargement des questions...
      </div>

    </section>

  </main>

</div>



<!-- =====================================================
     MODALE DE MODIFICATION
====================================================== -->

<div
  id="questionEditModal"
  class="question-edit-modal"
  style="display:none;"
>

  <div class="question-edit-modal-card">


    <!-- ===================================================
         HEADER MODALE
    ==================================================== -->

    <div class="question-edit-modal-header">

      <h2>
        Modifier la question
      </h2>


      <button
        type="button"
        id="closeQuestionEditModal"
        aria-label="Fermer"
      >
        ✕
      </button>

    </div>



    <!-- ===================================================
         CATÉGORIE
    ==================================================== -->

    <div class="question-field">

      <label for="editQuestionCategory">
        Catégorie
      </label>

      <input
        id="editQuestionCategory"
        type="text"
        autocomplete="off"
      >

    </div>



    <!-- ===================================================
         TYPE
    ==================================================== -->

    <div class="question-field">

      <label for="editQuestionType">
        Type
      </label>

      <select id="editQuestionType">

        <option value="true_false">
          Vrai / Faux
        </option>

        <option value="simple_choice">
          Choix simple
        </option>

        <option value="multiple_choice">
          Choix multiple
        </option>

      </select>

    </div>



    <!-- ===================================================
         QUESTION
    ==================================================== -->

    <div class="question-field">

      <label for="editQuestionText">
        Question
      </label>

      <textarea
        id="editQuestionText"
        maxlength="500"
        placeholder="Rédige la question..."
      ></textarea>

    </div>



    <!-- ===================================================
         RÉPONSES DYNAMIQUES
    ==================================================== -->

    <div id="editQuestionAnswers">
    </div>



    <!-- ===================================================
         ACTIONS MODALE
    ==================================================== -->

    <div class="question-edit-actions">

      <button
        type="button"
        class="btn-secondary"
        id="cancelQuestionEdit"
      >
        Annuler
      </button>


      <button
        type="button"
        class="btn-primary"
        id="saveQuestionEdit"
      >
        💾 Enregistrer
      </button>

    </div>

  </div>

</div>



<!-- =====================================================
     SCRIPTS
====================================================== -->

<script src="app.js"></script>
<script src="theme.js"></script>


<script>

  document.addEventListener(
    "DOMContentLoaded",
    async function () {


      /* ===============================================
         SÉCURITÉ ADMIN
      ================================================ */

      const role =
        String(
          localStorage.getItem("role") || ""
        ).toLowerCase();


      if (role !== "admin") {

        alert(
          "Cette page est réservée à l'administrateur."
        );

        window.location.href =
          "home.html";

        return;
      }



      /* ===============================================
         NOM UTILISATEUR
      ================================================ */

      const name =
        localStorage.getItem("full_name") ||
        "Administrateur";


      const user =
        document.getElementById(
          "questionManagementUser"
        );


      if (user) {

        user.innerText =
          name;
      }



      /* ===============================================
         INITIALISATION GESTION QUESTIONS
      ================================================ */

      if (
        typeof initializeQuestionManagement ===
        "function"
      ) {

        await initializeQuestionManagement();

      } else {

        console.error(
          "initializeQuestionManagement() est introuvable dans app.js"
        );
      }

    }
  );

</script>

</body>

</html>
